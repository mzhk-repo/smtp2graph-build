name: Secure build and release evidence

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    name: Validate source and workflow policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm run test:receive -- --logging error
      - run: node test/ci/workflow-policy.cjs
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.1.0
      - name: Validate workflows
        run: docker run --rm -v "$PWD:/repo" rhysd/actionlint@sha256:f70fe2789baa8fe077577f1de2e0951171c62913ac4efcadcf7603bcf5008ab5 -color /repo/.github/workflows/*.yml

  publish-development:
    name: Build and push development image
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: validate
    uses: mzhk-repo/shared-workflows/.github/workflows/shared-ci-cd.yml@main # reviewed mutable exception; pin after shared-workflow release policy is available
    with:
      environment_name: development
      deploy: false
      use_ansible: true
      build_and_push_docker: true
      push_docker_image: true
      docker_image_name: smtp2graph-build

  publish-release:
    name: Build, publish and retain release evidence
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    uses: mzhk-repo/shared-workflows/.github/workflows/shared-ci-cd.yml@main # reviewed mutable exception; pin after shared-workflow release policy is available
    with:
      environment_name: production
      deploy: false
      use_ansible: true
      build_and_push_docker: true
      push_docker_image: true
      docker_image_name: smtp2graph-build
      release_tag: ${{ github.ref_name }}
      control_plane_sha: fe3e461911c68949d9586b52a9c3253fa9795a45
